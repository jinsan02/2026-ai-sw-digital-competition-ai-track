<text x="0" y="24" font-size="18" font-weight="600" class="ink">최종 추론 아키텍처 — 확신이 낮은 34.1%만 앙상블로</text><text x="0" y="48" font-size="14" class="sub">main이 전 행을 추론하고, top1−top2 마진 &lt; 1.0인 행만 보조 모델 2개와 평균 · 파란 경로 = 저마진 라우팅</text>
