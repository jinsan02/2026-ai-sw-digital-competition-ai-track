<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 1024 632" width="1024" height="632" role="img" aria-label="30,000행을 current_v1로 직렬화해 main(HCX-0.5B, INT8)이 전 행을 추론하고, 마진이 1.0 미만인 34.1% 행만 model_b·model_c(INT4)와 z-centered 로짓 평균을 낸 뒤 후처리 룰 12종을 거쳐 제출 파일을 만든다">
<title>최종 추론 아키텍처 — 확신이 낮은 34.1%만 앙상블로</title>
<style>
  text { font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #1f2328; }
  .ink { fill: #1f2328; } .sub { fill: #59636e; } .muted { fill: #818b98; } .lbl { fill: #59636e; }
